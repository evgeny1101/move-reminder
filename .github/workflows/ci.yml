name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install Python tooling
        run: python -m pip install ruff pytest

      - name: Install desktop validator
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils

      - name: Validate shell scripts
        run: |
          bash -n run.sh
          bash -n setup_dev.sh
          bash -n debian/move-reminder-launcher

      - name: Validate desktop entries
        run: |
          desktop-file-validate move-reminder.desktop
          desktop-file-validate debian/move-reminder.desktop

      - name: Validate Python syntax
        run: python -m py_compile timer_tray.py

      - name: Run Ruff
        run: ruff check .

      - name: Run pytest
        run: pytest -q
