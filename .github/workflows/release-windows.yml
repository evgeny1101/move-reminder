name: Release Windows Package

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-windows.txt

      - name: Build portable executable
        run: python -m PyInstaller --noconfirm --clean packaging/windows/move-reminder.spec

      - name: Verify portable executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/move-reminder-portable.exe")) {
            throw "Portable executable not found at dist/move-reminder-portable.exe"
          }

      - name: Set app version from tag
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart('v')
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer executable
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" "packaging/windows/move-reminder.iss"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/move-reminder-portable.exe
            dist/move-reminder-setup.exe
          generate_release_notes: true
